services:
  - type: web
    name: we-farm-official
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
